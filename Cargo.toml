[workspace]
resolver = "2"
members = [
    "crates/backup-core",
    "crates/backup-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2021"

[workspace.dependencies]
backup-core = { path = "crates/backup-core" }
jwalk = "0.9"
fs2 = "0.4"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm"] }
tempfile = "3"
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-dialog = { version = "2" }
