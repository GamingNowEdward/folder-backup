# 推送 v* tag 自动构建 MSI + 便携版并上传 GitHub Release
# 手动触发（workflow_dispatch）同样可用
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./target"

      - name: Install frontend dependencies
        run: npm ci

      # 门禁不过不发版；打包与发布复用本地同一脚本
      - name: Build MSI + portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-release.ps1

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $conf = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Folder Backup v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            release/*.msi
            release/*.zip
